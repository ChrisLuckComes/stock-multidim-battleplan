[pytest]
testpaths = tests
pythonpath = .
markers =
    market_regime: 本模块/用例自身在测市场闸门接线，conftest 不要替它钉宽基
    real_broad: 本用例需要真实宽基取数链路（如美股 usQQQ → bars_source 分流断言）
# 下面 4 个是**独立脚本**（含 `sys.exit(1 if FAILS else 0)`，自带 main()），
# 被 pytest 收集时会在 import/收集阶段直接 SystemExit ⇒ INTERNALERROR、一条都跑不了。
# 统一在这里 ignore，`pytest -q` 即可全量绿；要跑它们请直接
# `python tests/levels/test_breakout_edge.py` 等。
addopts = --ignore=tests/levels/test_breakout_edge.py --ignore=tests/levels/test_levels.py --ignore=tests/levels/test_us_short.py --ignore=tests/screen/test_confluence.py
